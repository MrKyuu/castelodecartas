*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#06235A url(fundo.png) center/cover;font-family:KH,sans-serif;color:#fff}
body.pt{background:#06235A url(fundo_retrato.png) center/cover}
#st{position:absolute;left:0;top:0;width:1266px;height:585px;transform-origin:0 0;font-size:16px}
.a{position:absolute}img{pointer-events:none}
input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;text-align:center;padding:0;width:100%}
input.a,textarea.a{width:auto}
select{appearance:none;-webkit-appearance:none}
.n{color:#06235A}.tl{text-align:left!important}
.pm{font-size:44px;width:48px;height:48px;text-align:center;line-height:44px;user-select:none;text-shadow:0 0 8px #9CC8FF}
.ar{width:46px;height:46px;border:3px solid #EEF4FF;border-radius:50%;font-size:32px;text-align:center;line-height:38px;box-shadow:0 0 8px #9CC8FF;background:#06235A}
.tab{font-size:17px;padding:2px 4px;border-bottom:3px solid transparent}.tab.on{border-color:#EEF4FF}
#sk{left:948px;top:10px;width:304px;height:565px;overflow-y:auto;padding:6px 8px;font-size:13px;scrollbar-width:none;background:#06235Acc;border:3px solid #EEF4FF;border-radius:14px;box-shadow:0 0 8px #9CC8FF}
#sk .r{display:grid;grid-template-columns:16px minmax(0,1fr) 34px 22px 42px 26px 38px;gap:4px;align-items:center;height:27px;border-bottom:1px solid #ffffff22}
#sk .r>*{min-width:0;text-align:center}
#sk .r>:nth-child(2){text-align:left;overflow:hidden;white-space:nowrap}
#sk .r input[type=checkbox]{width:16px;height:16px;accent-color:#5EE06A;margin:0}
#sk .t{font-size:18px;background:#FFEBB5;color:#06235A;border-radius:6px;height:21px;line-height:22px}
#sk select,#sk .r input:not([type=checkbox]){background:#12306e;border-radius:5px;height:21px;font-size:13px;text-align:center;text-align-last:center}
#sk .r>:nth-child(2) input{text-align:left;text-align-last:left;padding-left:4px}
input[type=number]{-moz-appearance:textfield}input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.hd{color:#9DB4D6;font-size:11px;position:sticky;top:-6px;background:#06235A;z-index:2;height:24px!important}
.bt{border:2px solid #EEF4FF;border-radius:20px;padding:4px 16px;box-shadow:0 0 6px #9CC8FF88;background:#06235A66}
.cc{position:relative;display:flex;align-items:center;gap:14px;height:92px;padding:0 16px;background:#06235Acc;border:2px solid #EEF4FF;border-radius:14px;box-shadow:0 0 6px #9CC8FF66}.cc.on{box-shadow:0 0 14px #CFE6FF;border-width:3px}
.th{filter:var(--inv,none);width:64px;height:64px;border-radius:50%;border:3px solid #EEF4FF;background:#0a2e6b center/cover;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
.ci{min-width:0}.cn{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}.cs{font-size:14px;opacity:.75;margin-top:4px}.cx{position:absolute;right:12px;top:8px;font-size:15px;opacity:.7}
#st{user-select:none;-webkit-user-select:none}input,textarea{user-select:text;-webkit-user-select:text}
[onclick]{cursor:pointer}@media (hover:hover){[onclick]:hover{filter:brightness(1.18)}}
.fi{background:#12306e;border-radius:6px;padding:0 6px}
